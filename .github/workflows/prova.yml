name: Prova

# Su ogni pull request: compila l'immagine come il Rilascio (client Vue + server .NET), ma senza pubblicarla.
# Serve a scoprire gli errori di compilazione prima del merge su main (sul Mac di Pietro non c'è dotnet).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prova-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  compila:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          build-args: |
            VERSIONE=${{ github.sha }}
          cache-from: type=gha
